[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chem-agent-demo"
version = "0.2.0"
description = "化工知识增强与工具调用演示系统"
requires-python = ">=3.11,<3.14"
dependencies = [
  "smolagents[openai]==1.26.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "scikit-learn>=1.6,<1.8",
  "pint>=0.24,<0.26",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
chem-agent = "chem_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<0.14", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/chem_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires real model credentials and makes billable API calls"]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
